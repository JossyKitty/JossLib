<nav class="jl-section-scroller">
  <div class="jl-section-scroller__background"></div>
  <ul class="jl-section-scroller__list">
    @for (tab of sections; track tab.itemID) {
      <li class="jl-section-scroller__item">
        <a
          [routerLink]="[]"
          [fragment]="tab.itemID"
          [ngClass]="{
            'jl-section-scroller__tab': true,
            'jl-section-scroller__tab--active': tab.itemID === selectedItemID,
          }"
        >
          <div class="jl-section-scroller__label">{{ tab.label }}</div>
          @if (tab.imgSrc) {
            <picture class="jl-section-scroller__picture">
              @for (imgSrc of tab.imgSrc; track imgSrc) {
                @if ($last) {
                  <img [src]="imgSrc" alt="" />
                } @else {
                  <source [srcset]="imgSrc" />
                }
              }
            </picture>
          }
        </a>
      </li>
    }
  </ul>
</nav>
